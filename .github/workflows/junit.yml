name: JUnit Tests

on:
  push:
    branches: [fix]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Download JUnit console launcher
        run: |
          curl -sL -o junit.jar https://repo1.maven.org/maven2/org/junit/platform/junit-platform-console-standalone/1.10.2/junit-platform-console-standalone-1.10.2.jar

      - name: Compile
        run: |
          javac -encoding UTF-8 -cp junit.jar Solution6.java L2024113155_6_Test.java

      - name: Run tests
        run: |
          java -jar junit.jar execute -cp . --select-class L2024113155_6_Test --details=tree
